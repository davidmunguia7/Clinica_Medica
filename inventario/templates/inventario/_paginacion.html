{% if is_paginated %}
<nav class="mt-4 flex items-center justify-between text-sm text-slate-600">
    {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}{% if filtro %}&filtro={{ filtro }}{% endif %}" class="hover:underline">Anterior</a>{% else %}<span></span>{% endif %}
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}{% if filtro %}&filtro={{ filtro }}{% endif %}" class="hover:underline">Siguiente</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
